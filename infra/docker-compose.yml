version: "3.9"

services:
  gpt2giga:
    image: python:3.11-slim
    container_name: gpt2giga
    environment:
      GIGACHAT_CREDS: ${GIGACHAT_CREDS:?set base64 client_id:client_secret}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      VERIFY_SSL: ${VERIFY_SSL:-false}
      PROXY_PORT: ${PROXY_PORT:-8443}
    command: >
      sh -c "
        apt-get update && apt-get install -y curl &&
        pip install --no-cache-dir gpt2giga &&
        gpt2giga
          --gigachat.credentials ${GIGACHAT_CREDS}
          --gigachat.scope ${GIGACHAT_SCOPE}
          --gigachat.verify-ssl-certs ${VERIFY_SSL}
          --proxy.port ${PROXY_PORT}
          --proxy.pass-model true
      "
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD-SHELL", "curl -L -f http://localhost:8443/v1/models || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  openclaw-gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.gateway
    container_name: openclaw-gateway
    depends_on:
      gpt2giga:
        condition: service_healthy
    environment:
      OPENCLAW_CONFIG: /app/config/openclaw.json
      GATEWAY_PORT: ${GATEWAY_PORT:-3001}
    volumes:
      - ../config:/app/config:ro
      - ../agents:/root/.openclaw/agents
    ports:
      - "3001:3001"
    command: >
      sh -c "openclaw start --config ${OPENCLAW_CONFIG} --port ${GATEWAY_PORT}"
